<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 上面三行给独立文件用。用 Artifact 工具发布时删掉这三行，它自带外壳。 -->
<title>事务隔离级别学习页</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：单栏工作簿。顶部一条进度轨，八个阶段自上而下，每个阶段一张图加一件要动手的事。 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#161c26; --muted:#5d6877; --faint:#8793a3;
  --line:#dde2e9; --line-strong:#b9c2ce; --tint-1:#eef1f5; --tint-2:#e3e8ef;
  --accent:#4a41cf; --accent-soft:#ecebfb;
  --ok:#157a4f; --ok-soft:#e1f3ea; --warn:#93600a; --warn-soft:#fbf0d9; --bad:#b9362f; --bad-soft:#fbe7e5;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
  --shadow:0 1px 2px rgba(22,28,38,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --panel:#171c23; --ink:#e8ebf0; --muted:#a0aab8; --faint:#77818f;
    --line:#262d37; --line-strong:#3a4350; --tint-1:#1c222a; --tint-2:#232a34;
    --accent:#9a93f0; --accent-soft:#232044;
    --ok:#4cc38a; --ok-soft:#13291f; --warn:#e0b04c; --warn-soft:#2e2510; --bad:#f0736a; --bad-soft:#331917;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    --shadow:0 0 0 rgba(0,0,0,0);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --panel:#171c23; --ink:#e8ebf0; --muted:#a0aab8; --faint:#77818f;
  --line:#262d37; --line-strong:#3a4350; --tint-1:#1c222a; --tint-2:#232a34;
  --accent:#9a93f0; --accent-soft:#232044;
  --ok:#4cc38a; --ok-soft:#13291f; --warn:#e0b04c; --warn-soft:#2e2510; --bad:#f0736a; --bad-soft:#331917;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --shadow:0 0 0 rgba(0,0,0,0);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.9em;background:var(--tint-1);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:900px;margin:0 auto;padding-block:28px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

/* 页头 */
.top{display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12.5px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.top h1{font-size:clamp(26px,5vw,34px);line-height:1.25;text-wrap:balance}
.lede{font-size:17px;max-width:40em}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;padding:3px 10px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);background:var(--panel)}
.tag b{color:var(--ink);font-weight:600}

/* 进度轨 */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.rail ol{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.rail a{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;text-decoration:none;
  color:var(--muted);font-size:13px;white-space:nowrap;border:1px solid transparent}
.rail em{font-style:normal}
.rail .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  border:1.5px solid var(--line-strong);font-variant-numeric:tabular-nums}
.rail a.done .no{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.rail a.here{color:var(--ink);border-color:var(--line-strong);background:var(--panel)}
.rail-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:640px){.rail a em{display:none}.rail a{padding:4px}}

/* 阶段 */
#stages{display:flex;flex-direction:column;gap:18px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  scroll-margin-top:60px;display:flex;flex-direction:column;min-width:0}
.stage-head{display:flex;gap:14px;align-items:flex-start;padding:18px 20px 0}
.stage-no{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  font-size:15px;background:var(--ink);color:var(--panel);font-variant-numeric:tabular-nums}
.stage-head h2{font-size:19px;line-height:1.35;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage-head h2 small{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.stage-q{color:var(--muted);font-size:14.5px}
.stage-body{padding:16px 20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stage-foot{border-top:1px dashed var(--line-strong);padding:12px 20px 14px}
.pass{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.pass input{margin-top:5px;accent-color:var(--ok);width:16px;height:16px;flex:none}
.sub{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.hint-line{font-size:13px;color:var(--muted)}
figure{display:flex;flex-direction:column;gap:8px;min-width:0}
figcaption{font-size:13px;color:var(--muted)}

/* 按钮与输入 */
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;padding:7px 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);
  font-size:14px;font-weight:600}
.btn:hover:not([disabled]){border-color:var(--ink)}
.btn.primary,.btn.sel{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{padding:4px 10px;font-size:13px;font-weight:500}
input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical;line-height:1.6}

/* 1 定界 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fact{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fact dt{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.fact dd{font-size:14.5px}
.ring{border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ring-out{border:1.5px dashed var(--line-strong)}
.ring-edge{border:1.5px solid var(--line-strong);background:var(--tint-1)}
.ring-core{border:2px solid var(--ink);background:var(--panel)}
.ring-label{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ring-label span{font-weight:400;letter-spacing:0}
.ring-core>.ring-label{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel)}
.ring-core>.chips .chip{border-color:var(--ink);font-weight:600}
.ring-out>.chips .chip{color:var(--muted);border-style:dashed;background:transparent}
.prereqs{display:flex;flex-direction:column;gap:6px}
details.pre{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.pre summary{cursor:pointer;font-weight:600;font-size:14.5px}
details.pre summary small{font-weight:400;color:var(--muted);margin-left:8px}
details.pre p{margin-top:6px;font-size:14.5px}

/* 图 */
.fig{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-x:auto;padding:10px}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
.fig:not(.scroll) svg{width:100%;min-width:520px}
.fig.scroll svg{max-width:none}
.fig .tbl-wrap{border:0;border-radius:0}
.fig table{font-size:14px}
.fig text{font-family:var(--sans);font-size:13px;fill:var(--ink)}
.node-note{min-height:1.7em;font-size:14.5px}
.g-node{cursor:pointer}
.g-node rect{fill:var(--panel);stroke:var(--line-strong);stroke-width:1.5}
.g-node text{font-weight:600;pointer-events:none}
.g-node.kind-core rect{stroke:var(--ink);stroke-width:2}
.g-node.kind-prereq rect{stroke-dasharray:5 4;fill:var(--tint-1)}
.g-node.kind-prereq text{font-weight:400;fill:var(--muted)}
.g-node.on rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.g-node.on text{fill:var(--ink)}
.g-edge line{stroke:var(--line-strong);stroke-width:1.5}
.g-edge text{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.g-edge.on line{stroke:var(--accent);stroke-width:2.2}
.g-edge.on text{fill:var(--ink)}
.g-arrow{fill:var(--line-strong)}
.g-arrow.on{fill:var(--accent)}
.dimmed .g-node:not(.on):not(.near),.dimmed .g-edge:not(.on){opacity:.36}
.q-actor rect{fill:var(--tint-1);stroke:var(--line-strong);stroke-width:1.5}
.q-actor text{font-weight:600}
.q-life{stroke:var(--line-strong);stroke-dasharray:4 5}
.q-msg line,.q-msg path{stroke:var(--faint);stroke-width:1.5;fill:none}
.q-msg text{font-size:12.5px;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.q-msg.on line,.q-msg.on path{stroke:var(--accent);stroke-width:2.4}
.q-msg.on text{fill:var(--ink);font-weight:600}
.q-arrow{fill:var(--faint)}
.q-arrow.on{fill:var(--accent)}

/* 自己画帧时用的 class：颜色都走这里，深色模式才不会看不清 */
.fig .t-muted{fill:var(--muted)} .fig .t-strong{font-weight:700} .fig .t-small{font-size:11.5px}
.fig .t-num{font-variant-numeric:tabular-nums} .fig .t-inv{fill:var(--panel)} .fig .t-mono{font-family:var(--mono)}
.fig .f-none{fill:none} .fig .panel{fill:var(--panel)} .fig .tint{fill:var(--tint-1)} .fig .tint2{fill:var(--tint-2)}
.fig .ink{fill:var(--ink)} .fig .acc{fill:var(--accent)} .fig .acc-soft{fill:var(--accent-soft)}
.fig .hot{fill:var(--bad)} .fig .hot-soft{fill:var(--bad-soft)} .fig .ok{fill:var(--ok)} .fig .ok-soft{fill:var(--ok-soft)}
.fig .c1{fill:var(--c1)} .fig .c2{fill:var(--c2)} .fig .c3{fill:var(--c3)}
.fig .s-line{stroke:var(--line-strong)} .fig .s-faint{stroke:var(--line)} .fig .s-ink{stroke:var(--ink)}
.fig .s-acc{stroke:var(--accent)} .fig .s-hot{stroke:var(--bad)} .fig .s-ok{stroke:var(--ok)}
.fig .sc1{stroke:var(--c1)} .fig .sc2{stroke:var(--c2)} .fig .sc3{stroke:var(--c3)}
.fig .gap{stroke:var(--panel);stroke-width:2}

/* 4 演示 */
.demo{display:flex;flex-direction:column;gap:12px;min-width:0}
.demo h3{font-size:16px}
.cap{font-size:15px;min-height:3.4em}
.cap b{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:8px;font-weight:600}
.dots{display:flex;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:22px;height:22px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.dots button::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong)}
.dots button.seen::before{background:var(--line-strong)}
.dots button.on::before{background:var(--accent);border-color:var(--accent)}
.ask{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ask-tag{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.ask-q{font-weight:600}
.ask-a{border-top:1px dashed var(--line-strong);padding-top:8px}

/* 3 连旧 */
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pair-top{display:grid;grid-template-columns:1fr auto 1fr}
.pair-top>div{padding:10px 14px;min-width:0}
.pair-known{background:var(--tint-1)}
.pair-top>.pair-arrow{display:grid;place-items:center;padding:0 2px;color:var(--muted);font-size:18px}
.pair-new{font-weight:600}
.pair-lab{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pair-notes{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.pair-notes>div{background:var(--panel);padding:8px 14px;font-size:14px;min-width:0}
.same b{color:var(--ok)} .differ b{color:var(--warn)}
@media (max-width:560px){.pair-top{grid-template-columns:1fr}.pair-top>.pair-arrow{display:none}.pair-notes{grid-template-columns:1fr}}

/* 5 讲回 */
.explain{display:flex;flex-direction:column;gap:10px}
.prompt{font-weight:600;font-size:16px}
.points{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.points label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.points input{margin-top:5px;accent-color:var(--ok);flex:none}
.cover{font-size:14px;color:var(--muted)}

/* 6 动手 */
.quiz{display:flex;flex-direction:column;gap:18px}
.qa{display:flex;flex-direction:column;gap:8px}
.qa-q{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;cursor:pointer;padding:9px 12px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--panel);font-size:14.5px;display:flex;gap:10px;align-items:baseline}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .mark{flex:none;width:1.2em;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .mark{color:var(--bad)}
.opt[disabled]{cursor:default}
.why,.reveal{font-size:14.5px;padding:8px 12px;border-radius:9px;background:var(--tint-1)}
.tasks{display:flex;flex-direction:column;gap:14px}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.task-t{font-weight:600}
.reveals{display:flex;flex-direction:column;gap:6px}
.reveals:empty{display:none}
.self{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

/* 7 探边 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.06em;color:var(--muted);background:var(--tint-1);white-space:nowrap}
tr:last-child td{border-bottom:0}
.myths{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.flip{text-align:left;cursor:pointer;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;
  background:var(--panel);display:flex;flex-direction:column;gap:6px;min-height:124px;font-size:14.5px}
.flip .lab{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--bad)}
.flip[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.flip[aria-pressed="true"] .lab{color:var(--ok)}
.flip .turn{margin-top:auto;font-size:12.5px;color:var(--muted)}
.deeper{display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* 8 留存 */
.card{border:2px solid var(--ink);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column}
.card li{line-height:2.1}
.blank{cursor:pointer;font-weight:600;padding:1px 10px;border-radius:6px;border:1.5px dashed var(--accent);
  background:var(--accent-soft);color:var(--accent);min-width:3em;line-height:1.5}
.blank.open{border-style:solid;background:transparent;color:var(--ink);border-color:var(--line-strong)}
.plan-wrap{display:flex;flex-direction:column;gap:10px}
.plan{display:flex;flex-direction:column;gap:6px}
.plan li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.plan .when{font-variant-numeric:tabular-nums;font-weight:600;min-width:6.5em}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tint-2);color:var(--muted);white-space:nowrap}
.pill.due{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}

/* 提示条与页脚 */
#notice{display:flex;flex-direction:column;gap:10px}
#notice:empty,#notice-review:empty{display:none}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.err{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 14px;font-size:14px;white-space:pre-wrap}
.foot{display:flex;flex-direction:column;gap:10px}
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <nav class="rail" id="rail" aria-label="学习进度"></nav>
  <div id="notice"></div>
  <main id="stages"></main>
  <footer class="foot" id="foot"></footer>
</div>

  if (attrs) for (const k in attrs){ if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
  for (const c of kids.flat()){
    if (c == null) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
function esc(x){
  return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* 行内只认三样：**粗体**、`代码`、换行 */
function fmt(x){
  return esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
}

function renderRail(){
  const ol = h('ol');
  for (const g of present){
    ol.append(h('li', null, h('a', {href:'#s-' + g.key, 'data-key':g.key, onclick:e => { e.preventDefault(); jump(g.key); }},

  }
  $('#rail').append(ol, h('span', {class:'rail-count', id:'rail-count'}));

function updateRail(){
  let n = 0;
  for (const g of present){
    const a = $('#rail a[data-key="' + g.key + '"]'), d = !!st.done[g.key];
    a.classList.toggle('done', d);
    a.setAttribute('aria-label', g.name + (d ? '（已过关）' : ''));
    if (d) n++;
  }
  $('#rail-count').textContent = n + ' / ' + present.length + ' 过关';
}
function jump(key){
  const t = $('#s-' + key);
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (t) t.scrollIntoView({behavior: calm ? 'auto' : 'smooth', block:'start'});
}
function watchScroll(){
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => {
    for (const e of es){
      if (!e.isIntersecting) continue;
      document.querySelectorAll('#rail a').forEach(a => a.classList.toggle('here', a.dataset.key === e.target.dataset.key));
    }
  }, {rootMargin:'-25% 0px -65% 0px'});
  document.querySelectorAll('.stage').forEach(x => io.observe(x));
}

function buildStage(g){
  const id = 'pass-' + g.key;

  cb.checked = !!st.done[g.key];
  cb.addEventListener('change', () => { st.done[g.key] = cb.checked; save(); updateRail(); });
  return h('section', {class:'stage', id:'s-' + g.key, 'data-key':g.key},
    h('header', {class:'stage-head'},
      h('span', {class:'stage-no', text:String(g.n), 'aria-hidden':'true'}),
      h('div', null, h('h2', null, g.name, h('small', {text:g.phase})), h('p', {class:'stage-q', text:g.q}))),
    h('div', {class:'stage-body'}),

}

/* ---------- 画关系图：节点放在格子里，连线带文字 ---------- */
function wrap2(t){
  t = String(t);
  if (t.indexOf('\n') >= 0) return t.split('\n').slice(0, 2);
  const wide = c => c.charCodeAt(0) > 255 ? 1 : 0.56;
  const total = Array.from(t).reduce((a, c) => a + wide(c), 0);
  if (total <= 8.2) return [t];
  const sp = t.lastIndexOf(' ', Math.ceil(t.length / 2) + 2);
  if (sp > 0) return [t.slice(0, sp), t.slice(sp + 1)];
  let acc = 0, cut = 0;
  for (const c of Array.from(t)){ if (acc >= total / 2) break; acc += wide(c); cut += c.length; }
  return [t.slice(0, cut), t.slice(cut)];
}
function arrowDefs(id, cls){
  const defs = s('defs');
  for (const kind of ['', 'on']){
    defs.append(s('marker', {id:id + '-a' + kind, viewBox:'0 0 10 10', refX:'8.5', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto'},
      s('path', {d:'M0 0.8 L9.5 5 L0 9.2 z', class:cls + (kind ? ' on' : '')})));
  }
  return defs;
}
function drawGraph(host, nodes, edges, opt){
  opt = opt || {}; nodes = nodes || []; edges = edges || [];
  const CW = 204, CH = 96, NW = 126, NH = 48, PAD = 12;
  const cols = Math.max.apply(null, nodes.map(n => n.col || 0).concat(0)) + 1;
  const rows = Math.max.apply(null, nodes.map(n => n.row || 0).concat(0)) + 1;
  const W = PAD * 2 + cols * CW, H = PAD * 2 + rows * CH, id = uid('g');
  const svg = s('svg', {viewBox:'0 0 ' + W + ' ' + H, width:W, height:H, role:'img', 'aria-label':opt.label || '关系图'});
  svg.append(arrowDefs(id, 'g-arrow'));
  const pos = {};
  nodes.forEach(n => { pos[n.id] = {x:PAD + (n.col || 0) * CW + CW / 2, y:PAD + (n.row || 0) * CH + CH / 2}; });
  const eg = s('g'), ng = s('g');
  svg.append(eg, ng);
  const edgeEls = [], nodeEls = {};
  edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const rev = edges.some(o => o !== e && o.from === e.to && o.to === e.from);
    const ox = rev ? -uy * 10 : 0, oy = rev ? ux * 10 : 0;
    const t = Math.min((NW / 2) / Math.max(Math.abs(ux), 1e-6), (NH / 2) / Math.max(Math.abs(uy), 1e-6));
    const x1 = a.x + ux * (t + 2) + ox, y1 = a.y + uy * (t + 2) + oy, x2 = b.x - ux * (t + 5) + ox, y2 = b.y - uy * (t + 5) + oy;
    const g = s('g', {class:'g-edge'}), ln = s('line', {x1:x1, y1:y1, x2:x2, y2:y2, 'marker-end':'url(#' + id + '-a)'});
    g.append(ln);
    if (e.label){
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      g.append(Math.abs(ux) >= Math.abs(uy)
        ? s('text', {x:mx, y:my - 7, 'text-anchor':'middle'}, e.label)
        : s('text', {x:mx + 8, y:my + 4, 'text-anchor':'start'}, e.label));
    }
    eg.append(g);
    edgeEls.push({e:e, g:g, ln:ln});
  });
  let cur = null;
  nodes.forEach(n => {
    const p = pos[n.id], flat = String(n.label).replace(/\n/g, '');
    const g = s('g', {class:'g-node kind-' + (n.kind || 'support')});
    g.append(s('rect', {x:p.x - NW / 2, y:p.y - NH / 2, width:NW, height:NH, rx:10}));
    const lines = wrap2(n.label), tx = s('text', {x:p.x, y:p.y, 'text-anchor':'middle'});
    lines.forEach((ln, i) => tx.append(s('tspan', {x:p.x, dy:i === 0 ? (lines.length === 1 ? '0.35em' : '-0.3em') : '1.3em'}, ln)));
    g.append(tx);
    ng.append(g);
    nodeEls[n.id] = g;
    if (opt.onSelect){
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', flat + (n.note ? '：' + n.note : ''));
      const pick = () => select(cur === n.id ? null : n.id);
      g.addEventListener('click', pick);
      g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); pick(); } });
    }
  });
  function mark(onNodes, onEdges, nearNodes){
    onNodes = onNodes || []; onEdges = onEdges || []; nearNodes = nearNodes || [];
    const any = onNodes.length > 0 || onEdges.length > 0;
    svg.classList.toggle('dimmed', any);
    nodes.forEach(n => {
      nodeEls[n.id].classList.toggle('on', any && onNodes.indexOf(n.id) >= 0);
      nodeEls[n.id].classList.toggle('near', any && nearNodes.indexOf(n.id) >= 0);
    });
    edgeEls.forEach(x => {
      const on = any && onEdges.some(p => p[0] === x.e.from && p[1] === x.e.to);
      x.g.classList.toggle('on', on);
      x.ln.setAttribute('marker-end', 'url(#' + id + '-a' + (on ? 'on' : '') + ')');
    });
  }
  function select(nid){
    cur = nid;
    if (!nid){ mark(); opt.onSelect(null); return; }
    const inc = edges.filter(e => e.from === nid || e.to === nid), near = [];
    inc.forEach(e => near.push(e.from, e.to));
    mark([nid], inc.map(e => [e.from, e.to]), near);
    opt.onSelect(nodes.filter(n => n.id === nid)[0]);
  }
  host.replaceChildren(svg);
  return {mark:mark};
}

/* ---------- 画时序图：角色排成列，消息一步一步出现 ---------- */
function drawSequence(host, actors, steps, upto){
  actors = actors || [];
  const COL = Math.max(150, Math.min(190, Math.floor(770 / Math.max(actors.length, 1)))), PAD = 10, TOP = 6, BH = 34, ROW = 48;
  const W = PAD * 2 + actors.length * COL, H = TOP + BH + 30 + steps.length * ROW + 6, id = uid('q');
  const svg = s('svg', {viewBox:'0 0 ' + W + ' ' + H, width:W, height:H, role:'img', 'aria-label':'时序图，共 ' + steps.length + ' 步，现在是第 ' + (upto + 1) + ' 步'});
  svg.append(arrowDefs(id, 'q-arrow'));
  const x = i => PAD + i * COL + COL / 2;
  const at = name => Math.max(0, actors.indexOf(name));
  actors.forEach((a, i) => {
    svg.append(s('line', {class:'q-life', x1:x(i), y1:TOP + BH, x2:x(i), y2:H - 4}));
    svg.append(s('g', {class:'q-actor'},
      s('rect', {x:x(i) - (COL - 26) / 2, y:TOP, width:COL - 26, height:BH, rx:8}),
      s('text', {x:x(i), y:TOP + BH / 2, dy:'0.35em', 'text-anchor':'middle'}, a)));
  });
  steps.forEach((sp, i) => {
    if (i > upto) return;
    const y = TOP + BH + 44 + i * ROW, on = i === upto, ia = at(sp.from), ib = at(sp.to), a = x(ia), b = x(ib);
    const g = s('g', {class:'q-msg' + (on ? ' on' : '')}), mk = 'url(#' + id + '-a' + (on ? 'on' : '') + ')';
    const lab = (i + 1) + '. ' + (sp.label || '');
    if (ia === ib){
      const right = ia < actors.length - 1 || actors.length === 1, k = right ? 1 : -1;
      g.append(s('path', {d:'M' + a + ' ' + (y - 12) + ' h' + (34 * k) + ' v20 h' + (-28 * k), 'marker-end':mk}),
        s('text', {x:a + 42 * k, y:y + 2, 'text-anchor':right ? 'start' : 'end'}, lab));
    } else {
      g.append(s('line', {x1:a, y1:y, x2:b - (b > a ? 3 : -3), y2:y, 'marker-end':mk}),
        s('text', {x:(a + b) / 2, y:y - 8, 'text-anchor':'middle'}, lab));
    }
    svg.append(g);
  });
  host.replaceChildren(svg);
}

/* ---------- 4 演示 ---------- */
function renderDemos(body, list){
  list.forEach(demo => {
    const steps = demo.steps || [], seen = {0:true};
    let i = 0, graph = null;
    const fig = h('div', {class:'fig' + (demo.kind === 'frames' ? '' : ' scroll'), tabindex:'0', 'aria-label':'分步演示，可以用左右方向键切换'});
    const cap = h('p', {class:'cap', 'aria-live':'polite'});
    const ask = h('div', {class:'ask', hidden:true});
    const prev = h('button', {class:'btn', type:'button', onclick:() => go(i - 1)}, '上一步');
    const next = h('button', {class:'btn primary', type:'button', onclick:() => go(i + 1)}, '下一步');
    const dots = h('div', {class:'dots', role:'group', 'aria-label':'步骤'},
      steps.map((_, k) => h('button', {type:'button', 'aria-label':'第 ' + (k + 1) + ' 步', onclick:() => go(k)})));
    if (demo.kind === 'graph') graph = drawGraph(fig, demo.nodes, demo.edges, {label:demo.title || '演示'});
    function go(k){ if (k < 0 || k >= steps.length) return; i = k; seen[k] = true; show(); }
    function show(){
      const sp = steps[i] || {};
      if (demo.kind === 'frames') {
        if (sp.table) fig.replaceChildren(tableEl(sp.table));
        else fig.innerHTML = typeof sp.svg === 'function' ? sp.svg() : (sp.svg || '');
      }
      else if (demo.kind === 'sequence') drawSequence(fig, demo.actors, steps, i);
      else if (graph) graph.mark(sp.nodes, sp.edges, sp.nodes);
      cap.innerHTML = '<b>' + (i + 1) + ' / ' + steps.length + '</b>' + fmt(sp.caption || '');
      const nx = steps[i + 1];
      ask.hidden = !(nx && nx.ask);
      if (nx && nx.ask) ask.replaceChildren(h('div', {class:'ask-tag', text:'先猜，再点下一步'}), h('div', {class:'ask-q', html:fmt(nx.ask)}));
      prev.disabled = i === 0;
      next.disabled = i === steps.length - 1;
      Array.from(dots.children).forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('seen', !!seen[k] && k !== i); });
    }
    fig.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowRight'){ ev.preventDefault(); go(i + 1); }
      else if (ev.key === 'ArrowLeft'){ ev.preventDefault(); go(i - 1); }
    });
    body.append(h('div', {class:'demo'}, demo.title ? h('h3', {text:demo.title}) : null, fig, cap, ask, h('div', {class:'ctl'}, prev, dots, next)));
    show();
  });
}

/* ---------- 5 讲回 ---------- */
function copyText(text, done){
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); }
  catch (e) { done(false); }
}
function renderExplain(body, list){
  list.forEach((ex, k) => {
    const key = 'explain-' + k;
    const ta = h('textarea', {id:key, placeholder:'合上上面的内容，用自己的话写。写不出来的地方，就是还没懂的地方。', 'aria-label':'你的讲回'});
    ta.value = st.text[key] || '';
    ta.addEventListener('input', () => { st.text[key] = ta.value; save(); });
    const cover = h('p', {class:'cover', 'aria-live':'polite'});
    const rows = (ex.points || []).map((p, j) => {
      const cb = h('input', {type:'checkbox', id:key + '-p' + j});
      cb.addEventListener('change', tally);
      return {cb:cb, row:h('label', {for:key + '-p' + j}, cb, h('span', {html:fmt(p)}))};
    });
    function tally(){
      const n = rows.filter(r => r.cb.checked).length;
      cover.textContent = '你讲到了 ' + n + ' / ' + rows.length + ' 个要点。' + (n < rows.length ? '没讲到的，回到对应的阶段再看一遍，然后重新讲，不要只是把答案读一遍。' : '');
    }
    const pts = h('div', {class:'points', hidden:true}, h('div', {class:'sub', text:'对照要点：你讲到了哪些？'}), rows.map(r => r.row), cover);
    const show = h('button', {class:'btn', type:'button', onclick:() => { pts.hidden = false; tally(); }}, '写完了，对照要点');
    const status = h('span', {class:'hint-line', 'aria-live':'polite'});
    const copy = h('button', {class:'btn', type:'button'}, '复制给 Claude 批改');
    copy.addEventListener('click', () => {
      const text = '我在学「' + D.title + '」。\n题目：' + ex.prompt + '\n我的讲回：\n' + (ta.value.trim() || '（还没写）') +
        '\n\n请批改：指出我讲对了什么、漏了什么、哪里讲错了。先不要直接给标准答案，让我自己再试一次。';
      copyText(text, ok => { status.textContent = ok ? '已复制，粘贴到对话里。' : '没能自动复制，请手动选中你写的内容。'; });
    });
    body.append(h('div', {class:'explain'}, h('p', {class:'prompt', html:fmt(ex.prompt)}), ta, h('div', {class:'ctl'}, show, copy, status), pts));
  });
}

/* ---------- 6 动手 ---------- */
function renderPractice(body, d){
  if (has(d.quiz)){
    const score = h('p', {class:'cover', 'aria-live':'polite'});
    let right = 0, first = 0;
    body.append(h('div', {class:'quiz'}, d.quiz.map((q, qi) => {
      const why = h('div', {class:'why', hidden:true, 'aria-live':'polite'});
      let tries = 0, solved = false;
      const btns = (q.options || []).map((o, oi) => {
        const mark = h('span', {class:'mark', text:'ABCDEF'.charAt(oi)});
        const b = h('button', {class:'opt', type:'button'}, mark, h('span', {html:fmt(o.text)}));
        b.addEventListener('click', () => {
          if (solved) return;
          tries++;
          why.hidden = false;
          if (o.correct){
            solved = true; right++; if (tries === 1) first++;
            b.classList.add('right'); mark.textContent = '✓';
            btns.forEach(x => { x.disabled = true; });
            why.innerHTML = '<strong>对。</strong>' + fmt(o.why || '');
            score.textContent = '答对 ' + right + ' / ' + d.quiz.length + ' 题，其中 ' + first + ' 题一次答对。';
          } else {
            b.classList.add('wrong'); mark.textContent = '✗'; b.disabled = true;
            why.innerHTML = '<strong>不对。</strong>' + fmt(o.why || '再想想。');
          }
        });
        return b;
      });
      return h('div', {class:'qa'}, h('p', {class:'qa-q', html:(qi + 1) + '. ' + fmt(q.q)}), h('div', {class:'opts'}, btns), why);
    }), score));
  }
  if (has(d.tasks)){
    body.append(h('div', {class:'tasks'}, d.tasks.map((t, ti) => {
      const key = 'task-' + ti, hints = t.hints || [];
      let shown = 0;
      const hintBox = h('div', {class:'reveals'});
      const hintBtn = hints.length ? h('button', {class:'btn small', type:'button'}, '给个提示') : null;
      if (hintBtn) hintBtn.addEventListener('click', () => {
        if (shown < hints.length){ hintBox.append(h('div', {class:'reveal', html:'<strong>提示 ' + (shown + 1) + '</strong>　' + fmt(hints[shown])})); shown++; }
        if (shown >= hints.length) hintBtn.disabled = true;
      });
      const ans = h('div', {class:'reveal', hidden:true, html:'<strong>参考答案</strong>　' + fmt(t.answer || '')});
      const ansBtn = h('button', {class:'btn small', type:'button'}, '看参考答案');
      ansBtn.addEventListener('click', () => { ans.hidden = !ans.hidden; ansBtn.textContent = ans.hidden ? '看参考答案' : '收起答案'; });
      const yes = h('button', {class:'btn small', type:'button'}, '我做出来了'), no = h('button', {class:'btn small', type:'button'}, '没做出来');
      const paint = () => {
        yes.classList.toggle('sel', st.text[key] === 'yes'); no.classList.toggle('sel', st.text[key] === 'no');
        yes.setAttribute('aria-pressed', String(st.text[key] === 'yes')); no.setAttribute('aria-pressed', String(st.text[key] === 'no'));
      };
      yes.addEventListener('click', () => { st.text[key] = 'yes'; save(); paint(); });
      no.addEventListener('click', () => { st.text[key] = 'no'; save(); paint(); });
      paint();
      return h('div', {class:'task'}, h('p', {class:'task-t', html:fmt(t.task)}), h('div', {class:'ctl'}, hintBtn, ansBtn), hintBox, ans,
        h('div', {class:'self'}, '先自己做，再看答案：', yes, no));
    })));
  }
}

/* ---------- 7 探边 ---------- */
function renderLimits(body, d){
  if (has(d.fails)) body.append(h('div', {class:'tbl-wrap'}, h('table', null,
    h('thead', null, h('tr', null, h('th', {text:'在什么情况下'}), h('th', {text:'会怎样'}), h('th', {text:'换什么做法'}))),
    h('tbody', null, d.fails.map(f => h('tr', null, h('td', {html:fmt(f.when)}), h('td', {html:fmt(f.then)}), h('td', {html:fmt(f.instead || '')})))))));
  if (has(d.myths)) body.append(h('div', {class:'sub', text:'常见误解：先想想错在哪，再点开'}), h('div', {class:'myths'}, d.myths.map(m => {
    const b = h('button', {class:'flip', type:'button', 'aria-pressed':'false'});
    const paint = () => {
      const open = b.getAttribute('aria-pressed') === 'true';
      b.replaceChildren(h('span', {class:'lab', text:open ? '其实' : '误解'}), h('span', {html:fmt(open ? m.truth : m.myth)}),
        h('span', {class:'turn', text:open ? '点一下翻回去' : '点一下看真相'}));
    };
    b.addEventListener('click', () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); paint(); });
    paint();
    return b;
  })));
  if (has(d.deeper)) body.append(h('div', {class:'sub', text:'想再往深走'}),
    h('ul', {class:'deeper'}, d.deeper.map(x => h('li', {html:'<strong>' + esc(x.label) + '</strong>　' + fmt(x.note || '')}))));
}

/* ---------- 8 留存 ---------- */
function renderRetain(body, d){
  if (has(d.card)){
    const blanks = [];
    const setBlank = (b, open) => { b.classList.toggle('open', open); b.textContent = open ? b.dataset.a : '？'; b.setAttribute('aria-label', open ? b.dataset.a : '点开看答案'); };
    const card = h('ol', {class:'card'}, d.card.map(line => {
      const li = h('li');
      String(line).split(/(\{\{.+?\}\})/).forEach(part => {
        const m = part.match(/^\{\{(.+)\}\}$/);
        if (m){
          const b = h('button', {class:'blank', type:'button'});
          b.dataset.a = m[1];
          setBlank(b, false);
          b.addEventListener('click', () => setBlank(b, !b.classList.contains('open')));
          blanks.push(b);
          li.append(b);
        } else if (part) li.append(h('span', {html:fmt(part)}));
      });
      return li;
    }));
    body.append(h('div', {class:'sub', text:'学习卡：先在心里填空，再点开核对'}), card,
      h('div', {class:'ctl'},
        h('button', {class:'btn small', type:'button', onclick:() => blanks.forEach(b => setBlank(b, false))}, '全部遮住'),
        h('button', {class:'btn small', type:'button', onclick:() => blanks.forEach(b => setBlank(b, true))}, '全部揭开')));
  }
  const plan = h('div', {class:'plan-wrap'});
  body.append(h('div', {class:'sub', text:'复习计划'}), plan);
  function draw(){
    plan.replaceChildren();
    if (!st.finished){
      plan.append(h('p', {class:'hint-line', text:'学完这一页后点一下，页面会记下日期，告诉你哪天回来。'}),
        h('div', null, h('button', {class:'btn primary', type:'button', onclick:() => { st.finished = iso(today()); st.reviewed = []; save(); draw(); renderNotice(); }}, '今天学完了')));
      return;
    }
    const now = today(), done = st.reviewed || [];
    plan.append(h('p', {class:'hint-line', text:'学完于 ' + st.finished + '。复习时只做三件事：讲回、动手里的小测、学习卡。不要重读一遍。'}),
      h('ol', {class:'plan'}, reviewDays().map((n, k) => {
        const when = addDays(st.finished, n), isDone = done.indexOf(k) >= 0, due = when <= now;
        return h('li', null, h('span', {class:'when', text:iso(when)}), h('span', {text:'第 ' + (k + 1) + ' 次，隔 ' + n + ' 天'}),
          h('span', {class:'pill' + (isDone ? ' ok' : due ? ' due' : ''), text:isDone ? '已复习' : due ? '该复习了' : '还没到'}),
          (!isDone && due) ? h('button', {class:'btn small', type:'button', onclick:() => { st.reviewed = done.concat(k); save(); draw(); renderNotice(); }}, '这次复习完成') : null);
      })),
      h('div', null, h('button', {class:'btn small', type:'button', onclick:() => { st.finished = null; st.reviewed = []; save(); draw(); renderNotice(); }}, '重新计日')));
  }
  draw();
}

/* ---------- 到期提醒与复习模式 ---------- */
let reviewMode = false;
function renderNotice(){
  let box = $('#notice-review');
  if (!box){ box = h('div', {id:'notice-review'}); $('#notice').append(box); }
  box.replaceChildren();
  if (!D.retain || !st.finished) return;
  const now = today(), days = reviewDays(), done = st.reviewed || [];
  let k = -1;
  days.forEach((n, i) => { if (k < 0 && done.indexOf(i) < 0 && addDays(st.finished, n) <= now) k = i; });
  if (k < 0 && !reviewMode) return;
  const btn = h('button', {class:'btn', type:'button'}, reviewMode ? '退出复习模式' : '进入复习模式');
  btn.addEventListener('click', () => {
    reviewMode = !reviewMode;
    document.querySelectorAll('.stage').forEach(sec => { sec.hidden = reviewMode && ['explain', 'practice', 'retain'].indexOf(sec.dataset.key) < 0; });
    renderNotice();
  });
  box.append(h('div', {class:'banner'},
    h('span', {text:reviewMode ? '复习模式：只留下讲回、动手、留存三个阶段。' : '该复习了：第 ' + (k + 1) + ' 次，隔 ' + days[k] + ' 天。'}), btn));
}

/* ---------- 页脚：内容核对到什么程度 ---------- */
function renderFoot(){
  const f = $('#foot');
  if (has(D.checks)){
    const cls = {'已验证':' ok', '推测':' due'};
    f.append(h('div', {class:'sub', text:'这一页的内容核对到什么程度'}), h('div', {class:'tbl-wrap'}, h('table', null,
      h('thead', null, h('tr', null, h('th', {text:'说法'}), h('th', {text:'状态'}), h('th', {text:'依据'}))),
      h('tbody', null, D.checks.map(c => h('tr', null, h('td', {html:fmt(c.claim)}),
        h('td', null, h('span', {class:'pill' + (cls[c.status] || ''), text:c.status || ''})), h('td', {html:fmt(c.how || '')})))))));
  }
  f.append(h('p', {class:'hint-line', text:'过关记录、你写的内容和复习日期只保存在这个浏览器里。'}));
}

/* ---------- 数据自查：有问题就在页面顶部说出来 ---------- */
function validate(){
  const out = [];
  if (!D.title) out.push('缺少 title');
  if (D.map){
    const ns = D.map.nodes || [], ids = {}, cells = {};
    ns.forEach(n => {
      if (ids[n.id]) out.push('概念图里有重复的节点 id：' + n.id);
      ids[n.id] = true;
      const c = (n.col || 0) + ',' + (n.row || 0);
      if (cells[c]) out.push('概念图里有两个节点占了同一格（列 ' + (n.col || 0) + '，行 ' + (n.row || 0) + '）');
      cells[c] = true;
    });
    (D.map.edges || []).forEach(e => { if (!ids[e.from] || !ids[e.to]) out.push('概念图里的连线 ' + e.from + ' → ' + e.to + ' 指向了不存在的节点'); });
  }
  (D.demos || []).forEach((dm, i) => {
    if (['frames', 'sequence', 'graph'].indexOf(dm.kind) < 0) out.push('演示 ' + (i + 1) + ' 的 kind 只能是 frames、sequence 或 graph');
    if (!has(dm.steps)) out.push('演示 ' + (i + 1) + ' 没有 steps');
    if (dm.kind === 'frames') (dm.steps || []).forEach((sp, k) => { if (!sp.svg && !sp.table) out.push('演示 ' + (i + 1) + ' 第 ' + (k + 1) + ' 步既没有 svg 也没有 table'); });
    if (dm.kind === 'sequence') (dm.steps || []).forEach((sp, k) => {
      if ((dm.actors || []).indexOf(sp.from) < 0 || (dm.actors || []).indexOf(sp.to) < 0) out.push('演示 ' + (i + 1) + ' 第 ' + (k + 1) + ' 步的 from 或 to 不在 actors 里');
    });
  });
  ((D.practice && D.practice.quiz) || []).forEach((q, i) => {
    const n = (q.options || []).filter(o => o.correct).length;
    if (n !== 1) out.push('小测第 ' + (i + 1) + ' 题需要恰好一个正确选项，现在有 ' + n + ' 个');
  });
  return out;
}

boot();
})();
</script>
